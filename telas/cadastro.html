
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro AgroHAD</title>

    <link rel="icon" type="image/png" href="../img/LogoAgroHAD.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-center py-4">

        <section class="card shadow border-0 rounded-4 p-4 p-md-5 w-100" style="max-width: 480px;">

            <div class="text-center mb-3">
                <img src="../img/LogoAgroHAD.png" alt="Logo AgroHAD" class="img-fluid" style="max-width: 110px;">
            </div>

            <h1 class="text-center fw-bold mb-1">AgroHAD</h1>

            <p class="text-center text-secondary mb-4">
                Sistema de gerenciamento de bovinos
            </p>

            <form id="formCadastro">

                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input
                        type="text"
                        class="form-control"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="confirmarEmail" class="form-label">Confirmar e-mail</label>
                    <input
                        type="email"
                        class="form-control"
                        id="confirmarEmail"
                        name="confirmarEmail"
                        placeholder="Confirme seu e-mail"
                        required
                    >
                    <small id="erroEmail" class="text-danger"></small>
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>
                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="confirmarSenha" class="form-label">Confirmar senha</label>
                    <input
                        type="password"
                        class="form-control"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Confirme sua senha"
                        required
                    >
                    <small id="erroSenha" class="text-danger"></small>
                </div>

                <p id="mensagemCadastro" class="mb-3" role="status"></p>

                <button type="submit" class="btn btn-success w-100 py-2">
                    Cadastrar
                </button>

            </form>

        </section>

    </main>

    <div id="loading" class="position-fixed top-0 start-0 w-100 h-100 bg-dark bg-opacity-50 d-none justify-content-center align-items-center">

        <div class="card shadow border-0 rounded-4 p-4 text-center">
            <div class="spinner-border text-success mx-auto mb-3" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mb-0">Cadastrando...</p>
        </div>

    </div>

    <script src="../scripts/cadastro.js"></script>

</body>

</html>
