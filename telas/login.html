
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AgroHAD</title>

    <link rel="icon" type="image/png" href="../img/LogoAgroHAD.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <main class="container-fluid min-vh-100 d-flex justify-content-center align-items-center py-4">

        <section class="card shadow border-0 rounded-4 p-4 p-md-5 w-100" style="max-width: 430px;">

            <div class="text-center mb-3">
                <img src="../img/LogoAgroHAD.png" alt="Logo AgroHAD" class="img-fluid" style="max-width: 120px;">
            </div>

            <h1 class="text-center fw-bold mb-1">AgroHAD</h1>

            <p class="text-center text-secondary mb-4">
                Sistema de gerenciamento de bovinos
            </p>

            <form id="formLogin">

                <div class="mb-3">
                    <label for="email" class="form-label">E-mail</label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="mb-3">
                    <label for="senha" class="form-label">Senha</label>

                    <input
                        type="password"
                        class="form-control"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-2 mb-4">

                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="lembrar">
                        <label class="form-check-label" for="lembrar">
                            Lembrar minha senha
                        </label>
                    </div>

                    <a href="#" class="text-decoration-none small">Esqueci minha senha</a>

                </div>

                <button type="submit" class="btn btn-success w-100 py-2">
                    Entrar
                </button>

                <p id="mensagem" class="mt-3 mb-0" role="status"></p>

            </form>

            <p class="text-center text-secondary mt-4 mb-0">
                Ainda não possui uma conta?
                <a href="../telas/cadastro.html" class="text-success text-decoration-none fw-semibold">Cadastre-se</a>
            </p>

        </section>

    </main>

    <script src="../scripts/login.js"></script>

</body>

</html>
