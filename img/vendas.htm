               window.__INITIAL_DATA__ = {"data":{"type":"success","snack":{"id":"ae843265-3091-4042-9756-398924ddd4c3","hashId":"BwNjf8nElHc9cvgRNorhx","code":{"App.js":{"type":"CODE","contents":"import React, { useState } from 'react';\n\n\nimport LoginScreen from './screens/LoginScreen';\n\nimport HomeScreen from './screens/HomeScreen';\n\nimport ErrorScreen from './screens/ErrorScreen';\n\nimport { createClient } from '@supabase/supabase-js';\n\nconst supabase = createClient(\n  'https://udapwuchaidqmxcugrem.supabase.co',\n  'sb_publishable_pUwrnejjg9Fud-MQ13h9fg_H9cOMso7'\n);\n\n\nexport default function App() {\n\n  const [tela, setTela] = useState('login');\n\n  async function realizarLogin(email, senha) {\n\n    const { data, error } = await supabase.auth.signInWithPassword({\n      email: email,\n      password: senha\n    });\n\n    if (error) {\n\n      console.log('Erro no login:', error.message);\n\n      setTela('erro');\n\n    } else {\n\n      setTela('home');\n\n    }\n  }\n\n  function tentarNovamente() {\n\n    setTela('login');\n\n  }\n\n  async function sair() {\n\n    await supabase.auth.signOut();\n\n    setTela('login');\n\n  }\n\n  if (tela === 'login') {\n\n    return (\n      <LoginScreen\n        onLogin={realizarLogin}\n      />\n    );\n\n  }\n\n  if (tela === 'home') {\n\n    return (\n      <HomeScreen\n        onLogout={sair}\n      />\n    );\n\n  }\n\n  if (tela === 'erro') {\n\n    return (\n      <ErrorScreen\n        onRetry={tentarNovamente}\n      />\n    );\n\n  }\n\n  return null;\n\n}"},"assets/snack-icon.png":{"contents":"https://snack-code-uploads.s3.us-west-1.amazonaws.com/~asset/2f7d32b1787708aba49b3586082d327b","type":"ASSET"},"components/AssetExample.js":{"contents":"import { Text, View, StyleSheet, Image } from 'react-native';\n\nexport default function AssetExample() {\n  return (\n    <View style={styles.container}>\n      <Text style={styles.paragraph}>\n        Local files and assets can be imported by dragging and dropping them into the editor\n      </Text>\n      <Image style={styles.logo} source={require('../assets/snack-icon.png')} />\n    </View>\n  );\n}\n\nconst styles = StyleSheet.create({\n  container: {\n    alignItems: 'center',\n    justifyContent: 'center',\n    padding: 24,\n  },\n  paragraph: {\n    margin: 24,\n    marginTop: 0,\n    fontSize: 14,\n    fontWeight: 'bold',\n    textAlign: 'center',\n  },\n  logo: {\n    height: 128,\n    width: 128,\n  }\n});\n","type":"CODE"},"README.md":{"contents":"# Sample Snack app\n\nOpen the `App.js` file to start writing some code. You can preview the changes directly on your phone or tablet by scanning the **QR code** or use the iOS or Android emulators. When you're done, click **Save** and share the link!\n\nWhen you're ready to see everything that Expo provides (or if you want to use your own editor) you can **Download** your project and use it with [expo cli](https://docs.expo.dev/get-started/installation/#expo-cli)).\n\nAll projects created in Snack are publicly available, so you can easily share the link to this project via link, or embed it on a web page with the `<>` button.\n\nIf you're having problems, you can tweet to us [@expo](https://twitter.com/expo) or ask in our [forums](https://forums.expo.dev/c/expo-dev-tools/61) or [Discord](https://chat.expo.dev/).\n\nSnack is Open Source. You can find the code on the [GitHub repo](https://github.com/expo/snack).\n","type":"CODE"},"screens/ErrorScreen.js":{"type":"CODE","contents":"import React from 'react';\r\n\r\n\r\nimport {\r\n\r\n  View,\r\n\r\n  Text,\r\n\r\n  TouchableOpacity,\r\n\r\n  StyleSheet\r\n\r\n} from 'react-native';\r\n\r\n\r\nexport default function ErrorScreen({ onRetry }) {\r\n\r\n  return (\r\n\r\n    <View style={styles.container}>\r\n\r\n\r\n      <Text style={styles.titulo}>\r\n\r\n        ACESSO NEGADO\r\n\r\n      </Text>\r\n\r\n\r\n      <Text style={styles.mensagem}>\r\n\r\n        Usu\xE1rio ou senha incorretos.\r\n\r\n      </Text>\r
