<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro AgroHAD</title>

    <link rel="icon" type="image/png" href="../img/LogoAgroHAD.png">
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <!-- Conteúdo da página de cadastro -->
        <main class="cadastro">

        <section class="cadastro-card">

            <div class="logo-area">
                <img src="../img/LogoAgroHAD.png" alt="Logo AgroHAD">
            </div>

            <h1>AgroHAD</h1>

            <p class="subtitulo">
                Sistema de gerenciamento de bovinos
            </p>

            <form id="formCadastro">

                <div class="campo">
                    <label for="nome">Nome</label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="btn-cadastrar">Cadastrar</button>
            </form>
        </section>
</body>
</html>
